services:
  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  rag-app:
    build: .
    init: true
    ports:
      - "8501:8501"
      - "8502:8502"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma
    restart: unless-stopped

volumes:
  chroma_data:
    name: ai-chatbot_chroma_data